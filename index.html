<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>Mi Bodega — Punto de Venta e Inventario</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --sidebar:#0b1220; --card:#ffffff; --muted:#64748b;
  --line:#e2e8f0; --txt:#0f172a; --accent:#2563eb; --green:#16a34a; --red:#dc2626;
  --amber:#d97706; --violet:#7c3aed; --soft:#f1f5f9; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#f1f5f9;color:var(--txt);font-size:15px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:15px;}
.hidden{display:none !important;}

/* ===== LOGIN ===== */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e3a8a);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.login-card{background:#fff;border-radius:20px;padding:34px 28px;width:100%;max-width:380px;box-shadow:0 25px 60px rgba(0,0,0,.4);}
.login-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;}
.login-logo .ic{width:46px;height:46px;background:linear-gradient(135deg,#2563eb,#1e40af);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.login-logo b{font-size:22px;}
.login-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none;transition:.15s;background:#f8fafc;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:10px;font-weight:600;font-size:15px;transition:.15s;background:var(--soft);color:var(--txt);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-ghost{background:#fff;border:1.5px solid var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.login-hint{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6;}
</style>
<style>
/* ===== LAYOUT ===== */
#app{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s;}
.sb-head{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-head .ic{width:38px;height:38px;background:linear-gradient(135deg,#2563eb,#1e40af);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.sb-head b{color:#fff;font-size:16px;display:block;line-height:1.1;}
.sb-head small{font-size:11px;color:#94a3b8;}
.nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:#cbd5e1;font-size:14px;font-weight:500;margin-bottom:3px;transition:.15s;cursor:pointer;}
.nav a .ni{font-size:18px;width:22px;text-align:center;}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav a.active{background:var(--accent);color:#fff;}
.sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.05);margin-bottom:10px;}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}
.user-chip small{display:block;color:#94a3b8;font-size:11px;}
.user-chip b{color:#fff;font-size:13px;}
.main{flex:1;margin-left:230px;min-width:0;}
.topbar{display:none;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
.topbar .burger{font-size:24px;color:var(--txt);}
.content{padding:22px;max-width:1200px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;animation:fade .2s;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ph{margin-bottom:18px;}
.ph h1{font-size:22px;}
.ph p{color:var(--muted);font-size:14px;margin-top:2px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none;}

/* ===== CARDS / GRID ===== */
.grid{display:grid;gap:16px;}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.card.pad0{padding:0;overflow:hidden;}
.stat{display:flex;flex-direction:column;gap:4px;}
.stat .lbl{color:var(--muted);font-size:13px;font-weight:600;}
.stat .big{font-size:26px;font-weight:800;}
.stat .sub{font-size:12px;color:var(--muted);}
.stat.gr .big{color:var(--green);}
.stat.amber .big{color:var(--amber);}
.stat.rd .big{color:var(--red);}
.stat.bl .big{color:var(--accent);}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.rate-card{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;}
.rate-card .lbl{color:#bfdbfe;}
.rate-card .big{color:#fff;font-size:30px;}
.rate-card .sub{color:#bfdbfe;}
.rank{list-style:none;}
.rank li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px;}
.rank li:last-child{border:none;}
.rank .q{color:var(--muted);font-size:13px;font-weight:600;}
.crit li .q{color:var(--red);}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.b-red{background:#fee2e2;color:#b91c1c;}
.b-green{background:#dcfce7;color:#15803d;}
.b-amber{background:#fef3c7;color:#b45309;}
.b-blue{background:#dbeafe;color:#1d4ed8;}
.b-gray{background:#e2e8f0;color:#475569;}
</style>
<style>
/* ===== TABLES ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.toolbar .grow{flex:1;min-width:160px;}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none;background:#fff;}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:11px 12px;background:var(--soft);color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--soft);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.t-actions{display:flex;gap:6px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:15px;}
.icon-btn:active{transform:scale(.9);}
.right{text-align:right;}
.empty{text-align:center;padding:34px;color:var(--muted);}

/* ===== POS ===== */
.pos{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start;}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;max-height:66vh;overflow-y:auto;padding:2px;}
.prod-tile{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;transition:.12s;}
.prod-tile:active{transform:scale(.96);border-color:var(--accent);}
.prod-tile .pn{font-weight:700;font-size:13px;line-height:1.2;margin-bottom:6px;height:32px;overflow:hidden;}
.prod-tile .pp{color:var(--accent);font-weight:800;font-size:15px;}
.prod-tile .pb{color:var(--muted);font-size:11px;}
.prod-tile .ps{font-size:11px;margin-top:4px;}
.prod-tile.out{opacity:.45;}
.cart{position:sticky;top:16px;}
.cart-items{max-height:40vh;overflow-y:auto;margin-bottom:12px;}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--soft);}
.ci .cin{flex:1;min-width:0;}
.ci .cin b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci .cin small{color:var(--muted);font-size:11px;}
.qty{display:flex;align-items:center;gap:4px;}
.qty button{width:26px;height:26px;border-radius:6px;background:var(--soft);font-weight:700;font-size:15px;}
.qty input{width:46px;text-align:center;padding:4px;border:1px solid var(--line);border-radius:6px;}
.totbox{border-top:2px dashed var(--line);padding-top:12px;}
.totrow{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px;}
.totrow.big{font-size:20px;font-weight:800;}
.totrow.big .usd{color:var(--green);}
.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0;}
.pm{padding:10px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-size:12px;font-weight:600;transition:.12s;}
.pm.sel{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ===== MODAL ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
.modal-box.wide{max-width:600px;}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;}
.modal-head h3{font-size:17px;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fade .2s;}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}

@media(max-width:860px){
  .sidebar{transform:translateX(-100%);}
  body.menu-open .sidebar{transform:none;}
  body.menu-open .overlay{display:block;}
  .main{margin-left:0;}
  .topbar{display:flex;}
  .g3,.g2{grid-template-columns:1fr;}
  .pos{grid-template-columns:1fr;}
  .cart{position:static;}
  .content{padding:14px;}
  .row2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-card">
    <div class="login-logo"><div class="ic">🧺</div><b>Mi Bodega</b></div>
    <div class="login-sub">Sistema de Gestión — Punto de Venta</div>
    <div class="field"><label>Usuario</label><input id="lg-user" autocomplete="username" placeholder="usuario"></div>
    <div class="field"><label>Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••"></div>
    <button class="btn btn-primary btn-block" onclick="App.login()">Ingresar</button>
    <div class="login-hint" id="lg-hint"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <div class="overlay" onclick="App.toggleMenu(false)"></div>
  <aside class="sidebar">
    <div class="sb-head"><div class="ic">🧺</div><div><b id="sb-store">Mi Bodega</b><small>Sistema de Gestión</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="user-chip"><div class="av" id="u-av">A</div><div><b id="u-name">Admin</b><small id="u-role">Master</small></div></div>
      <button class="btn btn-ghost btn-block btn-sm" onclick="App.logout()">🚪 Cerrar sesión</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar"><button class="burger" onclick="App.toggleMenu(true)">☰</button><b id="tb-title">Mi Bodega</b></div>
    <div class="content">
      <section class="page active" id="pg-dashboard"></section>
      <section class="page" id="pg-inventario"></section>
      <section class="page" id="pg-pos"></section>
      <section class="page" id="pg-reportes"></section>
      <section class="page" id="pg-cobranza"></section>
      <section class="page" id="pg-config"></section>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
